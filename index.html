<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060a10"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>NEXUS — Command Center</title>
<style>
:root{--bg:#060a10;--panel:#0d1521;--line:#1c3246;--blue:#26caff;--muted:#8aa0b7;--text:#e8f3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 0%,#0b2033 0,transparent 45%),linear-gradient(135deg,#05080d,#080e18 55%,#05080d);color:var(--text);font-family:Inter,Arial,sans-serif;padding:30px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#1c34401b 1px,transparent 1px),linear-gradient(90deg,#1c34401b 1px,transparent 1px);background-size:40px 40px}.wrap{max-width:1100px;margin:auto;position:relative}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 2px 22px}.brand{letter-spacing:7px;font-weight:900;font-size:22px}.brand span{color:var(--blue)}.status{color:var(--blue);font-size:11px;letter-spacing:2px}.hero{margin:35px 0 22px}.eyebrow{font-size:11px;letter-spacing:4px;color:var(--blue)}h1{font-size:clamp(36px,6vw,70px);margin:8px 0;font-weight:800;letter-spacing:1px}.sub{color:var(--muted);letter-spacing:2px;font-size:12px}.grid{display:grid;grid-template-columns:1fr;gap:16px}.card{background:linear-gradient(145deg,#101b29e8,#0a1019f0);border:1px solid var(--line);padding:24px;border-radius:14px;box-shadow:0 12px 40px #0005;min-height:150px}.label{color:var(--muted);font-size:11px;letter-spacing:2px}.clock{font-size:clamp(40px,6vw,72px);font-weight:700;letter-spacing:2px;margin:12px 0;color:#d9f5ff}.date{color:var(--blue);font-size:13px;letter-spacing:2px}.search{display:flex;gap:10px;margin-top:15px}.search input{flex:1;min-width:0;background:#050a11;border:1px solid #21415a;border-radius:9px;color:white;padding:14px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 12px #26caff22}.search button,.link{background:#0c1a28;border:1px solid #24506b;color:var(--blue);padding:12px 15px;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:600}.search button:hover,.link:hover{background:#11283a}.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}.quick .card{min-height:auto;padding:18px}.quick a{display:block;text-decoration:none;color:var(--text);margin-top:12px;font-weight:600}.quick small{color:var(--muted)}.bottom{margin-top:18px;color:#57718a;font-size:10px;letter-spacing:2px;display:flex;justify-content:space-between}.pulse{display:inline-block;width:7px;height:7px;background:#27d8a0;border-radius:50%;margin-right:7px;box-shadow:0 0 10px #27d8a0}@media(max-width:750px){body{padding:18px}.grid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">NE<span>X</span>US</div><div class="status"><span class="pulse"></span>SYSTEM ONLINE</div></header>
<section class="hero"><div class="eyebrow">PERSONAL COMMAND CENTER</div><h1>WELCOME BACK.</h1><div class="sub">FOCUS. CREATE. EXPLORE.</div></section>
<div class="grid"><section class="card"><div class="label">LOCAL TIME / JAPAN</div><div class="clock" id="clock">--:--:--</div><div class="date" id="date">---</div></section></div>
<section class="quick"><div class="card"><div class="label">VIDEO</div><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">YouTube ↗</a><small>動画プラットフォーム</small></div><div class="card"><div class="label">VIDEO</div><a href="https://yewtu.be/" target="_blank" rel="noopener noreferrer">Yewtu ↗</a><small>Invidious フロントエンド</small></div><div class="card"><div class="label">SEARCH</div><a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google ↗</a><small>検索</small></div><div class="card"><div class="label">TRANSLATE</div><a href="https://www.deepl.com/translator" target="_blank" rel="noopener noreferrer">DeepL ↗</a><small>翻訳</small></div><div class="card"><div class="label">AI ASSISTANT</div><a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a><small>AIアシスタント</small></div></section>
<footer class="bottom"><span>NEXUS / PERSONAL UI</span><span>DESIGNED FOR YOUR WORKSPACE</span></footer></div>
<script>function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ja-JP',{hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).toUpperCase()}tick();setInterval(tick,1000);if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
